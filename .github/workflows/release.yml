name: Release

on:
  push:
    # Semver tags only. A bare 'v*' also matches the floating major tag (v0),
    # which made two release runs race for the same GitHub release and left a
    # stray draft behind.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write # create the GitHub release and upload assets

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser derives the changelog from git history.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      # GoReleaser shells out to syft for the SBOM step; the action does not
      # bundle it, so it has to be installed explicitly.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
