apiVersion: v1
kind: Pod
metadata:
  name: legacy-app
spec:
  hostNetwork: true
  containers:
    - name: app
      image: legacy-app:1.0
      ports:
        - containerPort: 80
          hostPort: 80
      securityContext:
        runAsUser: 0
        capabilities:
          add:
            - SYS_ADMIN
