apiVersion: v1
kind: Pod
metadata:
  name: privileged-debug
  labels:
    app: privileged-debug
spec:
  hostNetwork: true
  hostPID: true
  containers:
    - name: debug
      image: busybox:1.36
      command: ["sleep", "infinity"]
      securityContext:
        privileged: true
      volumeMounts:
        - name: host-root
          mountPath: /host
  volumes:
    - name: host-root
      hostPath:
        path: /
        type: Directory
