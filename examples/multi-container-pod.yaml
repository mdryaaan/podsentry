apiVersion: v1
kind: Pod
metadata:
  name: multi-container-app
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  initContainers:
    - name: migrate
      image: ghcr.io/example/migrate:2.1.0
      securityContext:
        runAsUser: 1000
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
  containers:
    - name: app
      image: ghcr.io/example/app:2.1.0
      securityContext:
        runAsUser: 1000
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
    - name: sidecar-proxy
      image: ghcr.io/example/proxy:1.9.0
      securityContext:
        runAsUser: 1001
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
          add:
            - NET_BIND_SERVICE
